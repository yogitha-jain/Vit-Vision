<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VetVision | Dashboard</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img
                src="../assets/logo.jpeg"
                alt="VetVision"
            >
        </div>


        <nav class="sidebar-menu">

            <a
                href="dashboard.html"
                class="sidebar-link active"
            >
                <span class="sidebar-icon">⌂</span>
                Dashboard
            </a>


            <a
                href="history.html"
                class="sidebar-link"
            >
                <span class="sidebar-icon">▣</span>
                History
            </a>


            <a
                href="profile.html"
                class="sidebar-link"
            >
                <span class="sidebar-icon">◯</span>
                Profile
            </a>


            <a
                href="settings.html"
                class="sidebar-link"
            >
                <span class="sidebar-icon">⚙</span>
                Settings
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="../index.html"
                class="sidebar-link logout-link"
            >
                <span class="sidebar-icon">↪</span>
                Logout
            </a>

        </div>

    </aside>


    <main class="main-content dashboard-content page-enter">

        <section class="dashboard-heading">

            <p class="small-heading">
                Welcome to
            </p>

            <h1>VetVision 🐾</h1>

            <p>
                Choose what you would like to analyze.
            </p>

        </section>


        <section class="dashboard-cards">

            <a
                href="animal-selection.html?mode=disease"
                class="dashboard-card disease-card"
            >

                <div class="dashboard-card-icon">
                    🩺
                </div>

                <h2>Disease Detection</h2>

                <p>
                    Analyze an animal image for disease detection.
                </p>

                <span class="card-arrow">
                    →
                </span>

            </a>


            <a
                href="animal-selection.html?mode=breed"
                class="dashboard-card breed-card"
            >

                <div class="dashboard-card-icon">
                    🐾
                </div>

                <h2>Breed Detection</h2>

                <p>
                    Identify the breed of your animal from an image.
                </p>

                <span class="card-arrow">
                    →
                </span>

            </a>

        </section>

    </main>

</div>

</body>

</html>
