<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Breed History - VetVision</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/history.css">

</head>


<body>

<div class="app-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <img
                src="../assets/logo.jpeg"
                alt="VetVision"
            >

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="history.html"
                class="active"
            >
                History
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="settings.html">
                Settings
            </a>

            <a href="../index.html">
                Logout
            </a>

        </nav>

    </aside>



    <!-- MAIN CONTENT -->

    <main class="main-content">


        <button
            type="button"
            class="back-button"
            onclick="history.back()"
        >
            ← Back
        </button>



        <div class="history-detail-container">


            <div class="page-heading">

                <h1>
                    Breed Detection
                </h1>

                <p>
                    Detection details
                </p>

            </div>



            <!-- RESULT -->

            <section
                class="history-detail-card"
                id="breedHistoryContent"
            >

                <div class="history-loading">
                    Loading...
                </div>

            </section>



            <!-- ERROR -->

            <div
                class="history-error"
                id="breedHistoryError"
            ></div>


        </div>

    </main>

</div>



<!-- API CONFIG -->

<script src="../js/config.js"></script>

<!-- COMMON JS -->

<script src="../js/main.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    loadBreedHistory
);



async function loadBreedHistory() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    const content =
        document.getElementById(
            "breedHistoryContent"
        );


    const error =
        document.getElementById(
            "breedHistoryError"
        );


    /*
        A history record ID is required.
    */

    if (!id) {

        content.innerHTML = `

            <p>
                Detection record was not specified.
            </p>

        `;

        return;

    }


    try {

        const baseURL =
            window.VETVISION_API_BASE_URL ||
            "";


        /*
            Get the actual breed history
            record from the backend.
        */

        const response =
            await fetch(

                `${baseURL}/api/history/breed/${encodeURIComponent(id)}`,

                {

                    method: "GET",

                    credentials:
                        "include"

                }

            );


        if (!response.ok) {

            throw new Error(
                "Unable to load this detection record."
            );

        }


        /*
            Actual backend record.
        */

        const record =
            await response.json();


        /*
            Render only information
            actually returned by backend.
        */

        content.innerHTML = `

            ${
                record.imageUrl
                    ? `

                        <div class="history-image">

                            <img
                                src="${escapeHTML(
                                    record.imageUrl
                                )}"
                                alt="Animal"
                            >

                        </div>

                      `
                    : ""
            }


            <div class="history-detail-info">


                ${
                    record.animalType
                        ? `

                            <div class="history-detail-row">

                                <span>
                                    Animal
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        record.animalType
                                    )}
                                </strong>

                            </div>

                          `
                        : ""
                }



                ${
                    record.breed
                        ? `

                            <div class="history-detail-row">

                                <span>
                                    Breed
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        record.breed
                                    )}
                                </strong>

                            </div>

                          `
                        : ""
                }



                ${
                    record.confidence !==
                        undefined &&
                    record.confidence !== null
                        ? `

                            <div class="history-detail-row">

                                <span>
                                    Confidence
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        String(
                                            record.confidence
                                        )
                                    )}
                                </strong>

                            </div>

                          `
                        : ""
                }



                ${
                    record.createdAt
                        ? `

                            <div class="history-detail-row">

                                <span>
                                    Date
                                </span>

                                <strong>
                                    ${formatDate(
                                        record.createdAt
                                    )}
                                </strong>

                            </div>

                          `
                        : ""
                }


            </div>

        `;

    }


    catch (err) {

        error.textContent =
            err.message ||
            "Unable to load detection.";

    }

}



/* =========================================
   DATE
========================================= */

function formatDate(
    value
) {

    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return escapeHTML(
            String(value)
        );

    }


    return date.toLocaleString();

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}

</script>

</body>

</html>
